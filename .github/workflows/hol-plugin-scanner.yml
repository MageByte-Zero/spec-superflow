name: Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashgraph-online/ai-plugin-scanner-action@c4737ed2f724bb612bd7df8c63f6835dd34181a3 # v1.2.392 / plugin-scanner 2.0.992 — pinned (last version under which main passed; @v1 auto-bumps). TODO: bump forward once shell-injection findings are cleaned up.
        with:
          plugin_dir: "."
          format: json
          output: plugin-scanner-report.json
          fail_on_severity: high
          pr_comment: always
          pr_comment_style: detailed
      - name: Upload plugin scanner report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-scanner-report
          path: plugin-scanner-report.json
          if-no-files-found: warn
